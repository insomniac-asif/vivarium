<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>huma</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body.debug { background: #0e0e12; }
  #stage { display: block; }
  #caption { position: fixed; left: 6px; top: 4px; color: #666; font: 11px monospace; display: none; }
  body.debug #caption { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="caption"></div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Huma — procedural built-in pet for Vivarium.
// An ash-phoenix chick, permanently pre-rebirth: soot-black coal body,
// signal-red ember veins that ignite while Claude works, eyes small but
// hotter than the veins. Fails to an ash pile with one live ember (sprite row
// only), overburns past 85% context, burns bright at night and grey by day.
// ---------------------------------------------------------------------------
var W = 200, H = 224;
var canvas = document.getElementById('stage');
var ctx = canvas.getContext('2d');
var DPR = 1;

function fit() {
  DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
fit();
window.addEventListener('resize', fit);

// palette — soot charcoals, one red accent, white-hot only inside eyes/veins
var SOOT_HI = '#2b2b32', SOOT = '#1f1f24', SOOT_LO = '#141418';
var EMBER = [255, 43, 51];       // #ff2b33
var EMBER_DIM = [139, 26, 30];   // #8b1a1e
var DAY_GREY = [106, 106, 110];  // veins bank to grey in daylight
var HOT_CORE = [255, 233, 221];  // white-hot (eye cores, overburn)

var state = { mood: 'idle', ctxPct: null, drowsy: false, sessions: 0, nightGlow: true };
var lastMood = 'idle';

// eased params: {value, target}
var P = {
  ign:   { v: 0.28, t: 0.28 }, // ember ignition 0..1
  hunch: { v: 0, t: 0 },       // forward work-hunch px
  headUp:{ v: 0, t: 0 },       // needs_you tilt-back
  sink:  { v: 0, t: 0 },       // asleep settle px
  lid:   { v: 0, t: 0 },       // eyelid closure 0..1
  wing:  { v: 0, t: 0 },       // wing lift (wave/flap) 0..1
};
var TARGETS = {
  working:   { ign: 1.0,  hunch: 4, headUp: 0, sink: 0, lid: 0 },
  needs_you: { ign: 0.72, hunch: 0, headUp: 1, sink: 0, lid: 0 },
  done:      { ign: 0.5,  hunch: 0, headUp: 0, sink: 0, lid: 0.35 },
  idle:      { ign: 0.28, hunch: 0, headUp: 0, sink: 0, lid: 0 },
  asleep:    { ign: 0.07, hunch: 0, headUp: 0, sink: 7, lid: 1 },
};

var lastT = null;
var blinkAt = 4000 + Math.random() * 3000;
var blink = 0;              // 0..1 closure from blinking
var wiggleT = -1;           // done-entry wiggle clock
var hopT = -1;              // needs_you hop clock
var nextHop = 2500;

// ember veins in body-local coords (y up = negative), clipped to the body
var VEINS = [
  [[-34, 6], [-16, -6], [-4, -22], [6, -38]],
  [[-26, 28], [-8, 18], [10, 10], [26, -2]],
  [[36, 12], [22, 2], [14, -14], [2, -26]],
  [[-38, -8], [-24, -16], [-12, -30]],
  [[8, 34], [18, 24], [32, 20]],
  [[-6, 40], [2, 28], [-2, 14]],
];

function lerp(a, b, k) { return a + (b - a) * k; }
function mix(c1, c2, k) {
  return 'rgb(' + Math.round(lerp(c1[0], c2[0], k)) + ',' +
                  Math.round(lerp(c1[1], c2[1], k)) + ',' +
                  Math.round(lerp(c1[2], c2[2], k)) + ')';
}

function frame(tms) {
  var dt = lastT === null ? 16 : Math.min(50, tms - lastT);
  lastT = tms;
  var t = tms / 1000;
  var k = 1 - Math.exp(-dt / 1000 * 5); // ~200ms easing

  var tgt = TARGETS[state.mood] || TARGETS.idle;
  for (var key in P) {
    var goal = (key in tgt) ? tgt[key] : 0;
    if (key === 'lid' && state.drowsy && state.mood !== 'asleep') goal = Math.max(goal, 0.6);
    P[key].v = lerp(P[key].v, goal, k);
  }

  // blink scheduling (suppressed under heavy lids)
  blinkAt -= dt;
  if (blinkAt <= 0 && P.lid.v < 0.5) { blink = 1; blinkAt = 4000 + Math.random() * 3000; }
  blink = Math.max(0, blink - dt / 130);

  if (wiggleT >= 0) wiggleT += dt;
  if (wiggleT > 700) wiggleT = -1;
  if (state.mood === 'needs_you') {
    nextHop -= dt;
    if (nextHop <= 0 && hopT < 0) { hopT = 0; nextHop = 2200 + Math.random() * 1800; }
  }
  if (hopT >= 0) hopT += dt;
  if (hopT > 420) hopT = -1;

  draw(t);
}

function draw(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  var ign = P.ign.v;
  var overburn = (typeof state.ctxPct === 'number' && state.ctxPct > 85)
    ? (state.ctxPct - 85) / 15 : 0;
  var dayBank = state.nightGlow ? 0 : 0.55; // grey in daylight

  // motion
  var breath = 1 + 0.025 * Math.sin(t * (state.mood === 'asleep' ? 0.7 : 1.6));
  var sway = (state.mood === 'idle') ? Math.sin(t * 0.7) * 1.5 : 0;
  var bob = (state.mood === 'working') ? Math.sin(t * 5.6) * 1.6 : 0;
  var wig = (wiggleT >= 0) ? Math.sin(wiggleT / 700 * Math.PI * 4) * 3 : 0;
  var hop = (hopT >= 0) ? -Math.sin(hopT / 420 * Math.PI) * 9 : 0;
  var flick = 1 + (state.mood === 'working' ? 0.18 : 0.08) * Math.sin(t * 9.3)
                + 0.05 * Math.sin(t * 23.7);

  var cx = W / 2 + sway + wig;
  var cy = 128 + P.sink.v + bob + hop + P.hunch.v * 0.5;
  var tilt = -P.headUp.v * 0.10 + P.hunch.v * 0.014 + wig * 0.01;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);
  ctx.scale(1 / breath, breath);

  // tail nub
  ctx.fillStyle = SOOT_LO;
  ctx.beginPath();
  ctx.ellipse(-46, 26, 12, 8, 0.6, 0, Math.PI * 2);
  ctx.fill();

  // body — soot egg with radial coal shading
  var g = ctx.createRadialGradient(-8, -18, 8, 0, 4, 66);
  g.addColorStop(0, SOOT_HI); g.addColorStop(0.65, SOOT); g.addColorStop(1, SOOT_LO);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, 52, 58, 0, 0, Math.PI * 2);
  ctx.fill();

  // coal facets (static darker patches)
  ctx.fillStyle = 'rgba(10,10,13,0.35)';
  [[-24, 14, 14, 9, 0.4], [18, 26, 12, 7, -0.5], [26, -18, 10, 6, 0.9], [-14, -34, 9, 6, -0.3]]
    .forEach(function (f) {
      ctx.beginPath(); ctx.ellipse(f[0], f[1], f[2], f[3], f[4], 0, Math.PI * 2); ctx.fill();
    });

  // wings — stubby, slightly darker; lift on wave/needs_you flap
  var wingLift = P.wing.v * 26 + (state.mood === 'needs_you' ? Math.max(0, Math.sin(t * 6)) * 4 : 0);
  ctx.fillStyle = SOOT_LO;
  ctx.beginPath();
  ctx.ellipse(-48, 20 - wingLift * 0.4, 10, 17, 0.45 - wingLift * 0.02, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(48, 20 - wingLift, 10, 17, -0.45 + wingLift * 0.03, 0, Math.PI * 2);
  ctx.fill();

  // ember veins — clipped to body, glow pass + core pass (+ overburn cores)
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, 0, 52, 58, 0, 0, Math.PI * 2);
  ctx.clip();
  // vein color: dim->bright ember by ignition, banked toward grey in daylight
  var base = [
    lerp(EMBER_DIM[0], EMBER[0], ign),
    lerp(EMBER_DIM[1], EMBER[1], ign),
    lerp(EMBER_DIM[2], EMBER[2], ign),
  ];
  if (dayBank) base = [lerp(base[0], DAY_GREY[0], dayBank), lerp(base[1], DAY_GREY[1], dayBank), lerp(base[2], DAY_GREY[2], dayBank)];
  var baseCss = 'rgb(' + base.map(Math.round).join(',') + ')';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  VEINS.forEach(function (v, vi) {
    var pulse = flick * (1 + 0.12 * Math.sin(t * 3.1 + vi * 1.7));
    ctx.beginPath();
    ctx.moveTo(v[0][0], v[0][1]);
    for (var i = 1; i < v.length; i++) ctx.lineTo(v[i][0], v[i][1]);
    ctx.strokeStyle = baseCss;
    ctx.globalAlpha = Math.min(1, 0.22 * ign * pulse * (1 - dayBank * 0.4) + 0.04);
    ctx.lineWidth = 4.5;
    ctx.stroke();
    ctx.globalAlpha = Math.min(1, (0.25 + 0.75 * ign) * pulse * (1 - dayBank * 0.3));
    ctx.lineWidth = 1.5;
    ctx.stroke();
    if (overburn > 0) {
      ctx.strokeStyle = 'rgb(' + HOT_CORE.join(',') + ')';
      ctx.globalAlpha = 0.55 * overburn * (0.6 + 0.4 * Math.sin(t * 4.2 + vi));
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  // eyes — small, hotter than the veins; always the brightest thing
  var eyeY = -18 - P.headUp.v * 4;
  var lidTotal = Math.min(1, Math.max(P.lid.v, blink));
  [-20, 20].forEach(function (ex) {
    if (lidTotal < 0.98) {
      var eyeIgn = Math.max(0.55, ign) * (1 - dayBank * 0.25);
      ctx.globalAlpha = 0.3 * eyeIgn;
      ctx.fillStyle = 'rgb(255,90,74)';
      ctx.beginPath(); ctx.arc(ex, eyeY, 7, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(ex, eyeY, 4.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgb(' + HOT_CORE.join(',') + ')';
      ctx.beginPath(); ctx.arc(ex, eyeY, 1.7 + overburn * 0.8, 0, Math.PI * 2); ctx.fill();
      // eyelid sweep (soot-colored)
      if (lidTotal > 0.02) {
        ctx.fillStyle = SOOT;
        ctx.fillRect(ex - 8, eyeY - 8, 16, 16 * lidTotal - 8 + 1);
      }
    } else {
      // closed: dark seam with a faint banked ember underneath
      ctx.strokeStyle = 'rgba(11,11,13,1)';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(ex - 4, eyeY); ctx.quadraticCurveTo(ex, eyeY + 2, ex + 4, eyeY); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,43,51,' + (0.12 + 0.06 * Math.sin(t * 1.3)) + ')';
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(ex - 3, eyeY + 1.5); ctx.quadraticCurveTo(ex, eyeY + 3, ex + 3, eyeY + 1.5); ctx.stroke();
    }
  });

  // beak — small triangle, slightly lighter than the face so it silhouettes,
  // with an ember-lit lower edge
  ctx.fillStyle = '#33333b';
  ctx.beginPath();
  ctx.moveTo(-5.5, -9); ctx.lineTo(5.5, -9); ctx.lineTo(0, -1);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = baseCss;
  ctx.globalAlpha = 0.55 + 0.45 * ign;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-4.5, -8); ctx.lineTo(0, -1.6); ctx.lineTo(4.5, -8); ctx.stroke();
  ctx.globalAlpha = 1;

  // rim light — separates the soot body from dark wallpapers
  ctx.strokeStyle = '#3a3a42';
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.ellipse(0, 0, 51.4, 57.4, 0, -Math.PI * 0.92, -Math.PI * 0.12);
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.restore();

  // session dots
  if (state.sessions >= 2) {
    var n = Math.min(state.sessions, 5);
    ctx.fillStyle = '#8b1a1e';
    var total = n * 8 - 5;
    var x0 = (W - total) / 2;
    for (var i = 0; i < n; i++) {
      ctx.beginPath();
      ctx.arc(x0 + i * 8 + 1.5, H - 6, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function loop(tms) { frame(tms); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

// ---- public API -----------------------------------------------------------
window.juna = { // bridge.js looks for window.vivarium || window.juna
  setState: function (s) {
    if (!s) return;
    ['ctxPct', 'drowsy', 'sessions', 'nightGlow'].forEach(function (kk) {
      if (kk in s && s[kk] !== undefined) state[kk] = s[kk];
    });
    if (s.mood && s.mood !== lastMood) {
      if (s.mood === 'done') wiggleT = 0;
      lastMood = s.mood;
    }
    if (s.mood) state.mood = s.mood;
    if (s.debugCaption !== undefined) document.getElementById('caption').textContent = s.debugCaption;
  },
};

// test hook for headless verification (rAF pauses when not composited)
window.__huma = {
  step: function (ms) { frame((lastT === null ? 0 : lastT) + (ms || 16)); },
  params: function () { var o = {}; for (var kk in P) o[kk] = +P[kk].v.toFixed(3); return o; },
  occupancy: function () {
    var d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    var n = 0;
    for (var i = 3; i < d.length; i += 4) if (d[i] > 10) n++;
    return n;
  },
  snapshot: function () { return canvas.toDataURL(); },
};

// ---- debug mode -----------------------------------------------------------
(function () {
  if (!/\bdebug\b/.test(location.search)) return;
  document.body.classList.add('debug');
  var phases = [
    { mood: 'working', cap: 'working — veins ignited' },
    { mood: 'needs_you', cap: 'needs_you — head up, flap, hop' },
    { mood: 'done', cap: 'done — wiggle, content' },
    { mood: 'idle', cap: 'idle — banked embers' },
    { mood: 'idle', cap: 'overburn — ctx 92%', ctx: 92 },
    { mood: 'idle', cap: 'daylight — banked grey', night: false },
    { mood: 'asleep', cap: 'asleep — ember seam' },
  ];
  var i = 0;
  setInterval(function () {
    var p = phases[i++ % phases.length];
    window.juna.setState({ mood: p.mood, sessions: 3, drowsy: false,
      nightGlow: p.night !== false, ctxPct: p.ctx || 40, debugCaption: p.cap });
  }, 2800);
})();
</script>
<script src="bridge.js"></script>
</body>
</html>
