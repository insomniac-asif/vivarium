<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Space Grotesk", system-ui, sans-serif; }
    a { color: #ff2b33; } a:hover { color: #ff5a4a; }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&amp;display=swap">
</helmet>
<div style="width: 640px; height: 640px; background: #0e0e12; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px">
  <svg viewBox="0 0 200 200" width="480" height="480" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="soot" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0" stop-color="#2b2b32"></stop>
        <stop offset="0.55" stop-color="#1f1f24"></stop>
        <stop offset="1" stop-color="#141418"></stop>
      </linearGradient>
      <linearGradient id="flame" x1="0" y1="1" x2="0.3" y2="0">
        <stop offset="0" stop-color="{{ember}}" stop-opacity="0.55"></stop>
        <stop offset="0.5" stop-color="{{ember}}"></stop>
        <stop offset="1" stop-color="#ffe9dd"></stop>
      </linearGradient>
    </defs>

    <!-- tail wedge -->
    <path d="M 34 148 C 22 142 10 136 6 140 C 4 148 14 158 30 162 Z" fill="#141418"></path>

    <!-- body: plump, chest-heavy, brooding hunch -->
    <path d="M 32 150
             C 30 108 52 68 96 58
             C 118 53 138 60 148 76
             C 156 88 158 104 154 122
             C 150 146 132 168 104 174
             C 72 180 36 172 32 150 Z" fill="url(#soot)"></path>

    <!-- folded wing -->
    <path d="M 58 92
             C 88 82 120 88 132 102
             C 128 130 112 152 88 158
             C 66 162 52 148 50 128
             C 49 114 51 100 58 92 Z" fill="#17171b"></path>
    <path d="M 88 158 C 100 150 116 136 126 116" fill="none" stroke="#0e0e10" stroke-width="1.4" stroke-linecap="round"></path>
    <path d="M 78 154 C 90 144 102 130 110 114" fill="none" stroke="#0e0e10" stroke-width="1.2" stroke-linecap="round"></path>

    <!-- ember flame crest, sweeping back off the crown -->
    <g style="opacity: {{ignition}}">
      <path d="M 122 58
               C 112 44 106 34 96 26
               C 96 36 90 40 84 32
               C 84 44 76 46 68 38
               C 72 50 64 54 54 48
               C 62 60 58 64 48 62
               C 60 72 74 74 88 68
               C 102 64 114 62 122 58 Z" fill="url(#flame)"></path>
      <path d="M 118 60 C 108 50 100 44 92 40" fill="none" stroke="#ffe9dd" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round"></path>
    </g>

    <!-- chest crack-veins -->
    <g stroke-linecap="round" fill="none" style="opacity: {{ignition}}">
      <path d="M 146 96 L 138 110 L 144 124 L 136 138" stroke="{{ember}}" stroke-width="3.2" stroke-opacity="0.28"></path>
      <path d="M 146 96 L 138 110 L 144 124 L 136 138" stroke="{{ember}}" stroke-width="1.3"></path>
      <path d="M 152 112 L 146 122 L 150 132" stroke="{{ember}}" stroke-width="2.6" stroke-opacity="0.25"></path>
      <path d="M 152 112 L 146 122 L 150 132" stroke="{{ember}}" stroke-width="1.1"></path>
      <path d="M 128 128 L 122 140 L 128 152" stroke="{{ember}}" stroke-width="1.0" stroke-opacity="0.85"></path>
    </g>

    <!-- head detail: brow, eye, beak -->
    <path d="M 124 76 C 132 72 142 74 148 80" fill="none" stroke="#0e0e10" stroke-width="2.4" stroke-linecap="round"></path>
    <circle cx="136" cy="84" r="4.4" fill="{{ember}}"></circle>
    <circle cx="137" cy="83" r="1.7" fill="#ffe9dd"></circle>
    <path d="M 150 82 L 170 90 L 148 98 C 151 93 151 87 150 82 Z" fill="#0e0e10"></path>
    <path d="M 150 96 L 166 90" fill="none" stroke="{{ember}}" stroke-width="1" stroke-opacity="0.7"></path>

    <!-- talons -->
    <path d="M 84 174 L 78 184 M 84 174 L 86 185 M 84 174 L 92 183" stroke="#0b0b0d" stroke-width="3" stroke-linecap="round" fill="none"></path>
    <path d="M 112 176 L 106 186 M 112 176 L 114 187 M 112 176 L 120 185" stroke="#0b0b0d" stroke-width="3" stroke-linecap="round" fill="none"></path>
  </svg>
  <div style="color: #6a6a6e; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase">Huma - permanently pre-rebirth</div>
</div>
</x-dc>
<script data-dc-script data-props='{"ember":{"editor":"color","default":"#ff2b33","options":["#ff2b33","#ff4020","#e8222e","#ff5a4a"]},"ignition":{"editor":"range","default":1,"min":0.15,"max":1,"step":0.05},"$preview":{"width":640,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      ember: this.props.ember ?? '#ff2b33',
      ignition: this.props.ignition ?? 1,
    };
  }
}
</script>
</body>
</html>
